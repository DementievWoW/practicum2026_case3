# Заглушка стека наблюдаемости. Участник 4 (инфраструктура).
# Prometheus скрейпит /metrics приложения, Grafana строит дашборд.
#
# Порядок запуска:
#   1) python -m case3.infra.runtime       # /metrics на :9100 (хост)
#   2) docker compose up                    # Prometheus :9090, Grafana :3000
#   3) http://localhost:3000  (admin/admin) → дашборд «SQL Security»
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: sqlsec-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # доступ к /metrics на хосте (Linux)

  grafana:
    image: grafana/grafana:latest
    container_name: sqlsec-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
